<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelEase</title>
  <style>
    .header{
      display:flex;
      justify-content: space-around;
      align-items: center;
      background-color: white;
      color:rgb(94, 92, 88);
      margin:0;
    }
    .header h1{
      color: blue;
    }

.header a {
    color: rgb(94, 92, 88);  /* Normal color */
    text-decoration: none;
}

.header a:hover {
    color: blue;             /* When hovering */
}

.header a.active {
    color: blue;             /* Selected page */
}
    .header button{
      background-color: white;
      color:blue;
      border: 2px solid blue;
      border-radius: 10px;
      font-size: 18px;
      padding: 10px 30px;
    }

    .footer{
      display:flex;
      justify-content: space-around;
      align-items: center;
      color:black;
      padding: 0 30px;
    }

    .footer button{
      background-color: black;
      color: white;
      border: 2px solid black;
      border-radius: 10px;
      padding: 10px 30px;
      font-size: 18px;
    }

  </style>
</head>
<body>
  <div class="header">
    <h1>TravelEase</h1>
    <a href="{% url 'flights' %}">Flights</a>
    <a href="{% url 'hotels' %}">Hotels</a>
    <a href="{% url 'trains' %}">Trains</a>
    <h4>Manage Bookings <br>My Trip</h4>
    <button value="Submit">Login/Signup</button>
  </div>
  {% block content %}

  {% endblock %}
  <hr>
  <div class="footer">
    
    <h3>Follow Us</h3>
    <div class="center">
       <h3>Book Tickets faster. Download our mobile apps</h3>
        <button>Get it on<br>Google Play</button>
        <button>Download on the <br>App Store</button>
    </div>
    <h6>2026 Makemytrip (india) Private Limited. All rights reserved</h6>
  </div>
</body>
</html>
