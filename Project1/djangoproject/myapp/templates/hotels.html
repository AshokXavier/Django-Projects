{% extends 'base.html' %}

{% block content %}

<style>

  
  .head{
    background-color: rgb(255, 111, 0);
    color:white;
    text-align: center;
  }
  .head h2{
    padding: 20px 0;
  }

  .body{
    padding-left: 40px;
    padding-right: 40px;
    border: 0.5px solid rgb(188, 180, 180);
    border-radius: 2px;;
  }

  .first{
    display: flex;
    gap:15px;
    align-items: center;
    padding: 10px;
    font-family: Arial, Helvetica, sans-serif;
  }

  .first fieldset{
    border:2px solid #dce3ed;
    border-radius: 10px;
    height:65px;
    margin:0;
    box-sizing: border-box;
  }
.first legend {
    color: #667085;
    font-size: 16px;
    font-weight: bold;
    padding: 0 5px;
}

.first input {
    border: none;
    outline: none;
    font-size: 20px;
    font-weight: bold;
    width: 100%;
    background-color: transparent;
    color: #222;
}
  .third {
    text-align: center;
    margin: 30px 0;
}
 .third button{
  background-color: rgb(255, 111, 0);
  border:2px solid rgb(255, 111, 0);
  border-radius: 30px;
  color: white;
  padding:10px 20px;
  font-size: 18px;

 }
</style>

<div class="flight">
  <div class="head">
    <h2>Book Hotels and Homestays</h2>
  </div>

  <div class="body">



    <div class="first">
      <fieldset class="destination">
        <legend>Where to</legend>
        <input type="text" value="Vagamon">
      </fieldset>

      <fieldset class="checkin">
        <legend>Check-in</legend>
        <input type="text" value="16 Oct 26">
      </fieldset>

       <fieldset class="checkout">
        <legend>Check-out</legend>
        <input type="text" value="17 Oct 26">
      </fieldset>

       <fieldset class="guests">
        <legend>Guest & Rooms</legend>
        <input type="text" value="6 Adults | 1 Room">
      </fieldset>
    </div>

    <div class="third">
      <button>SEARCH</button>

    </div>
  </div>
</div>

{% endblock %}
